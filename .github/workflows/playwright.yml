# ══════════════════════════════════════════════════════════════════════════════
# Playwright E2E Tests
#
# PURPOSE:
#   Runs the full Playwright test suite on every push to main and uploads the
#   HTML report as an artifact so results can be reviewed in the Actions UI.
#
# TRIGGER: push to main (plus manual runs via workflow_dispatch)
#
# NOTES:
#   - Tests run against https://eventhub.rahulshettyacademy.com (live site,
#     see baseURL in playwright.config.ts)
#   - Chromium only (as configured in playwright.config.ts)
#   - The job fails when any test fails, but the HTML report is always uploaded
#   - HTML report is retained for 30 days as a downloadable artifact
# ══════════════════════════════════════════════════════════════════════════════

name: Playwright E2E Tests

on:
  push:
    branches: [main]

  # Allow manual runs from the GitHub Actions UI
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:

  # ╔═══════════════════════════════════════════════════════════════════════════
  # ║  Playwright Tests
  # ║  Installs dependencies, runs all specs, and uploads the HTML report.
  # ╚═══════════════════════════════════════════════════════════════════════════
  playwright:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Node.js setup ─────────────────────────────────────────────────────────
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ── Install root dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Install Playwright browsers ──────────────────────────────────────────
      # Only installs Chromium (--with-deps installs OS-level dependencies too)
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # ── Run all Playwright tests ─────────────────────────────────────────────
      # html reporter writes playwright-report/; line reporter streams to the log.
      # A test failure fails this step (and the job); the upload step below
      # still runs because of `if: always()`.
      - name: Run Playwright tests
        run: npx playwright test --reporter=html,line

      # ── Upload HTML report as artifact ───────────────────────────────────────
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30
